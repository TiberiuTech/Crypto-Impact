<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>list of cryptocurrencies</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23238636'/%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../navbar/navbar.css">
    <link rel="stylesheet" href="prices.css">
    
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

</head>
<body>

    <header id="navbar-placeholder"></header>
    
    <main>
        <h1>List of cryptocurrencies</h1>
        
        <div id="price-carousel-wrapper">
            <h2>Real-time prices (Last 1H)</h2>
            <div id="price-carousel">
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Coin</th>
                        <th>Prices</th>
                        <th>24h %</th>
                        <th>VOL.24H</th>
                        <th>Market Cap.</th>
                        <th>Chart 1H</th>
                        <th>Trade</th>
                    </tr>
                </thead>
                
                <tbody id="crypto-table-body">
                </tbody>
                
            </table>
        </div>
        
    </main>

    <div id="coinModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-header">
                <h2 id="modal-coin-title"></h2>
            </div>
            
            <div id="modal-stats" class="stats-grid">
            </div>
            
            <div id="modal-chart-container">
            </div>
            
            <div class="details-section-grid">
                <div id="modal-high-low" class="high-low-box">
                    <h3 class="section-title">High & Low (24h)</h3>
                    <div id="high-low-data" class="stats-grid-2">
                    </div>
                </div>

                <div id="modal-links" class="links-box">
                        <h3 class="section-title">Useful links</h3>
                    <div class="link-list">
                        <a href="#" target="_blank" class="simulated-link">Official website</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../navbar/loadNavbar.js"></script>
    <script type="module" src="../../client.js"></script>

</body>
</html>
