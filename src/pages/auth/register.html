<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Orionix</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../navbar/navbar.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header id="navbar-placeholder"></header>
    
    <main class="auth-main">
        <div class="auth-container">
            <h1>Înregistrare</h1>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-name">Nume</label>
                    <input type="text" id="register-name" name="name" required autocomplete="name">
                    <span class="error-message" id="name-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" required autocomplete="email">
                    <span class="error-message" id="email-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="register-password">Parolă</label>
                    <input type="password" id="register-password" name="password" required autocomplete="new-password">
                    <span class="error-message" id="password-error"></span>
                    <small class="help-text">Parola trebuie să conțină minim 6 caractere, o cifră, un simbol și o literă</small>
                </div>
                
                <button type="submit" class="auth-submit-button primary">Înregistrează-te</button>
                
                <div class="auth-form-links">
                    <p>Ai deja cont? <a href="login.html">Autentifică-te</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script>
        // Așteptăm ca Firebase să fie încărcat complet
        window.addEventListener('load', function() {
            if (typeof firebase === 'undefined') {
                console.error('Firebase SDK nu s-a încărcat!');
            } else {
                console.log('Firebase SDK încărcat cu succes');
            }
        });
    </script>
    <script src="register.js"></script>
    <script src="../../navbar/loadNavbar.js"></script>
</body>
</html>
