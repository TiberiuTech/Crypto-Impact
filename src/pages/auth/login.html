<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23238636'/%3E%3C/svg%3E" type="image/svg+xml" />
    <title>Login</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../navbar/navbar.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header id="navbar-placeholder"></header>
    
    <main class="auth-main">
        <div class="auth-container">
            <h1>Login</h1>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required autocomplete="email">
                    <span class="error-message" id="email-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                    <span class="error-message" id="password-error"></span>
                </div>
                
                <button type="submit" class="auth-submit-button primary">Login</button>
                
                <div class="auth-form-links">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (typeof firebase === 'undefined') {
                console.error('Firebase SDK not loaded!');
            } else {
                console.log('Firebase SDK loaded successfully');
            }
        });
    </script>
    <script src="login.js"></script>
    <script src="../../navbar/loadNavbar.js"></script>
</body>
</html>
