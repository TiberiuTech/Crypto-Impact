<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23238636'/%3E%3C/svg%3E" type="image/svg+xml" />
    <title>News</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../navbar/navbar.css">
    <link rel="stylesheet" href="news.css">
</head>
<body>
    <header id="navbar-placeholder"></header>
    
    <main class="news-page">
        <div class="news-header">
            <h1>News</h1>
            <p class="news-subtitle">The latest news from the world of cryptocurrencies</p>
        </div>

        <div class="news-filters">
            <button class="filter-btn active" data-category="ALL">All</button>
            <button class="filter-btn" data-category="BTC">Bitcoin</button>
            <button class="filter-btn" data-category="ETH">Ethereum</button>
            <button class="filter-btn" data-category="BLOCKCHAIN">Blockchain</button>
            <button class="filter-btn" data-category="MARKET">Market</button>
        </div>

        <div id="loading-news" class="loading-container">
            <div class="spinner"></div>
            <p>Loading news...</p>
        </div>

        <div id="news-container" class="news-grid">
        </div>

        <div id="error-message" class="error-message" style="display: none;">
            <p>Could not load news. Check your connection and try again.</p>
            <button onclick="location.reload()" class="retry-btn">Reload</button>
        </div>
    </main>

    <script src="../../navbar/loadNavbar.js"></script>
    <script type="module" src="news.js"></script>
</body>
</html>
